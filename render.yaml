# Render blueprint: one free web service built from the Dockerfile. Secrets are entered in the Render dashboard, never committed.
services:
  - type: web
    name: collectpilot
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JOB_SECRET
        generateValue: true
      - key: SEED_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: OWNER_TELEGRAM_CHAT_ID
        sync: false
      - key: ALLOWED_TELEGRAM_CHAT_IDS
        sync: false
      - key: DEMO_CUSTOMER_CHAT_ID
        sync: false
      - key: DEMO_MODE
        value: "true"
